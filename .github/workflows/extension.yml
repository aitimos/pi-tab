name: Build and release extension

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Check release version
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node --input-type=module <<'JS'
          import {readFileSync} from 'node:fs';
          import assert from 'node:assert/strict';
          const pkg = JSON.parse(readFileSync('package.json'));
          const manifest = JSON.parse(readFileSync('extension/manifest.json'));
          assert.equal(process.env.RELEASE_TAG, `v${pkg.version}`);
          assert.equal(manifest.version, pkg.version);
          JS
      - run: npm run build
      - run: npm test
      - uses: actions/upload-artifact@v4
        with:
          name: pi-tab-extension
          path: |
            dist/pi-tab-extension.zip
            pi-bookmarklet-chat-install.html
          if-no-files-found: error

  browser-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        suite: [extension-zh, extension-en, tabs, bookmarklet, i18n, stop]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm install --no-save --package-lock=false agent-browser@0.34.0 playwright@1.57.0
      - run: npx playwright install --with-deps chromium
      - name: Locate test browser
        run: node --input-type=module -e "import {chromium} from 'playwright'; console.log('PI_TAB_TEST_CHROME='+chromium.executablePath())" >> "$GITHUB_ENV"
      - run: npm run build
      - name: Run headless browser regression
        env:
          SUITE: ${{ matrix.suite }}
          AGENT_BROWSER_HEADED: 'false'
          AGENT_BROWSER_ARGS: '--headless=new,--no-sandbox'
        run: |
          export PATH="$PWD/node_modules/.bin:$PATH"
          case "$SUITE" in
            extension-zh) npm run test:extension ;;
            extension-en) PI_TAB_TEST_LANGUAGE=en npm run test:extension ;;
            *) npm run "test:$SUITE" ;;
          esac

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build, browser-tests]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          name: pi-tab-extension
          path: release-assets
      - name: Extract release notes
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          tag = os.environ['RELEASE_TAG']
          sections = Path('CHANGELOG.md').read_text().split('\n## ')
          section = next((s for s in sections[1:] if s.splitlines()[0].split(' — ')[0] == tag), None)
          if section is None:
              raise SystemExit(f'Missing changelog for {tag}')
          Path('release-notes.md').write_text(section.split('\n', 1)[1].strip() + '\n')
          PY
      - name: Publish extension
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" --title "Pi Tab $RELEASE_TAG" --notes-file release-notes.md
            gh release upload "$RELEASE_TAG" release-assets/dist/pi-tab-extension.zip release-assets/pi-bookmarklet-chat-install.html --clobber
          else
            gh release create "$RELEASE_TAG" release-assets/dist/pi-tab-extension.zip release-assets/pi-bookmarklet-chat-install.html --verify-tag --title "Pi Tab $RELEASE_TAG" --notes-file release-notes.md
          fi
