name: Build and release extension

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node scripts/release.mjs verify
      - run: npm test
      - uses: actions/upload-artifact@v4
        with:
          name: pi-tab-extension
          path: |
            dist/pi-tab-extension.zip
            pi-bookmarklet-chat-install.html
          if-no-files-found: error

  browser-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        suite: [extension-zh, extension-en, tabs, bookmarklet, i18n, stop, queue, oauth, management]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Report browser test versions
        run: |
          node --version
          npx --no-install agent-browser --version
          npx --no-install playwright --version
      - run: npx playwright install --with-deps chromium
      - name: Locate test browser
        run: node --input-type=module -e "import {chromium} from 'playwright'; console.log('PI_TAB_TEST_CHROME='+chromium.executablePath())" >> "$GITHUB_ENV"
      - run: npm run build
      - name: Run headless browser regression
        env:
          SUITE: ${{ matrix.suite }}
          AGENT_BROWSER_HEADED: 'false'
          AGENT_BROWSER_ARGS: '--headless=new,--no-sandbox'
        run: |
          case "$SUITE" in
            extension-zh) npm run test:extension ;;
            extension-en) PI_TAB_TEST_LANGUAGE=en npm run test:extension ;;
            *) npm run "test:$SUITE" ;;
          esac

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-${{ matrix.suite }}
          path: /tmp/pi-tab*/*.png
          if-no-files-found: ignore
          retention-days: 7

  release:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: [build, browser-tests]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.publish.outputs.sha }}
      tag: ${{ steps.publish.outputs.tag }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Prepare and publish release
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release.mjs publish

  release-pages:
    needs: release
    if: needs.release.outputs.sha != ''
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml
    with:
      ref: ${{ needs.release.outputs.sha }}
