name: 功能建议 / Feature request
description: 说明你希望完成的任务和当前限制。
body:
  - type: textarea
    id: problem
    attributes:
      label: 使用场景与问题 / Use case and problem
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 期望的行为 / Proposed behavior
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 替代方法或参考 / Alternatives or references
      description: 可选。
