<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pi Tab</title>
<style>
:root{color-scheme:light dark;font:14px/1.5 system-ui,sans-serif}body{margin:0;padding:20px}header{display:flex;align-items:center;gap:12px}h1{font-size:18px;margin:0;flex:1}button,input{font:inherit;color:inherit;background:Canvas;border:1px solid GrayText;border-radius:6px;padding:7px 12px}button{cursor:pointer}button:focus-visible,input:focus-visible{outline:2px solid Highlight;outline-offset:3px}#rows{list-style:none;padding:0}#rows button{display:block;width:100%;text-align:start;margin:8px 0}small{display:block;opacity:.7}#search{box-sizing:border-box;width:100%}#error{color:light-dark(#a22020,#ff9c9c)}
</style></head><body><header><h1 id="heading"></h1><button id="rebuild" type="button" hidden></button><button id="refresh" type="button"></button><button id="close" type="button"></button></header><p id="help"></p><input id="search" type="search"><p id="error" role="alert"></p><ul id="rows"></ul><button id="more" type="button" hidden></button><script type="module" src="history-picker.js"></script></body></html>
